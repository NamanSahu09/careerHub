<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>CareerHub India — Find Your Next Job Faster</title>
    <meta name="description" content="Search 1.4 lakh+ live job openings across IT, sales, marketing, finance and design from 62,000+ companies hiring in India. Apply in one click on CareerHub." />
    <meta name="keywords" content="jobs in India, job search, recruitment, hiring, careers, job portal, IT jobs, remote jobs" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.careerhub.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CareerHub India" />
    <meta property="og:title" content="CareerHub India — Find Your Next Job Faster" />
    <meta property="og:description" content="1.4 lakh+ live openings from 62,000+ companies hiring across India. Search, filter, and apply in minutes." />
    <meta property="og:url" content="https://www.careerhub.example/" />
    <meta property="og:image" content="https://www.careerhub.example/og-cover.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CareerHub India — Find Your Next Job Faster" />
    <meta name="twitter:description" content="Search live job openings across India and apply in minutes." />
    <meta name="twitter:image" content="https://www.careerhub.example/og-cover.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#0B1F3A" />

    <!-- Structured data: Organization + WebSite with sitelinks searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CareerHub India",
      "url": "https://www.careerhub.example/",
      "logo": "https://www.careerhub.example/logo.png",
      "sameAs": [
        "https://www.linkedin.com/company/careerhub",
        "https://twitter.com/careerhub"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://www.careerhub.example/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.careerhub.example/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
