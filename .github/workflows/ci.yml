name: CareerHub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Node.js/Express)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: careerhub-backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd careerhub-backend
          npm install

      - name: Verify Server Syntax
        run: |
          cd careerhub-backend
          node --check server.js

  frontend-ci:
    name: Frontend CI (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: careerhub/package-lock.json

      - name: Install Dependencies
        run: |
          cd careerhub
          npm install

      - name: Build React SPA
        run: |
          cd careerhub
          npm run build
